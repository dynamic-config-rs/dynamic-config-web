name: CI

# No push trigger at all: everything travels through a pull request, and
# main only ever receives a SQUASH of a green PR — the squashed tree is
# byte-identical to the PR head the checks already ran on, so a main
# re-run would test the same content twice. Merging runs release.yml
# alone; workflow_dispatch stays as the manual escape hatch.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

jobs:
  # What changed, so the expensive jobs below can sit out a run that cannot
  # affect them. Deliberately a *job* rather than `on.pull_request.paths`:
  # a workflow filtered out at the trigger never reports at all, and a
  # required check that never reports leaves the pull request waiting for
  # ever. A skipped job, by contrast, passes the gate — `ci-ok` reads
  # `skipped` as success, which the `supply-chain` job in security.yml has
  # relied on since it was written.
  # Filtering applies to pull requests only. A push to `main` and a manual
  # dispatch run everything: `main` is what releases from, and a manual
  # dispatch has no base commit for a path filter to compare against.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'rustfmt.toml'
              - 'deny.toml'
              - '.github/workflows/**'
            docs:
              - '**/*.md'
              - '.github/workflows/**'

  fmt:
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy
      # A shared key across the read-only cargo jobs: `clippy`, `docs` and
      # `minimal-versions` build the same graph, and three private caches
      # is three cold starts for one dependency tree.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

  test:
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --workspace
      # And again in one thread. A configuration lives in a process-wide
      # static keyed by `TypeId`, so two tests sharing a section type race
      # in parallel and pass alone — this suite has already been bitten by
      # exactly that, and both orders have to be green.
      - if: runner.os == 'Linux'
        run: cargo test --workspace -- --test-threads=1

  examples:
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    name: every example runs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # An example that only compiles is not an example. Each writes into a
      # temporary directory and needs no setup.
      - run: cargo run -p dynamic-config-axum --example axum_two_sections
      - run: cargo run -p dynamic-config-actix --example actix_two_sections
      - run: cargo run -p dynamic-config-loco --example loco_two_sections

  msrv:
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # One row per crate, at the floor its own manifest declares. A
        # floor nobody compiles against is a number in a manifest rather
        # than a promise — and these three differ by seventeen releases,
        # which is the whole reason they are separate crates.
        include:
          - { rust: "1.88", package: dynamic-config-web-core }
          - { rust: "1.88", package: dynamic-config-tower }
          - { rust: "1.88", package: dynamic-config-axum }
          - { rust: "1.88", package: dynamic-config-actix }
          - { rust: "1.94", package: dynamic-config-loco }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      # A lockfile resolved by stable, then checked by the floor: a floor
      # that only holds against an old lockfile is not the floor a user
      # gets from `cargo add`.
      #
      # There is deliberately no `.cargo/config.toml` with
      # `resolver.incompatible-rust-versions = "fallback"` here, though the
      # engine's repository has one. Cargo applies it at the *lowest*
      # rust-version in the workspace, and this workspace spans 1.71 to 1.94
      # — so every crate in Loco's tree got held to 1.71, which pinned
      # `lettre` to 0.11.14 and RUSTSEC-2026-0141 with it. Resolving newest
      # and checking each library at its own floor is both the stricter test
      # and the one a user's `cargo add` reproduces.
      - run: cargo generate-lockfile
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: msrv-${{ matrix.rust }}
      # `check`, not `--all-targets`: the dev-dependencies pull the engine's
      # proc-macro chain, and `proc-macro-crate` → `toml_edit` → `indexmap`
      # → `hashbrown 0.17` declares 1.85. A user compiling this crate never
      # builds any of it, so a floor measured through it is not the floor
      # anybody pays. The engine's own MSRV job says the same thing.
      - run: cargo check -p ${{ matrix.package }} --locked

  docs:
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTDOCFLAGS: -D warnings --cfg docsrs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: check
      - run: cargo doc --workspace --all-features --no-deps

  minimal-versions:
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    name: the declared minimums resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: minimal
      # `axum = "0.8"` claims 0.8.0 works. This is what checks it.
      - run: cargo +nightly generate-lockfile -Z direct-minimal-versions
      - run: cargo +stable check --workspace --all-features --locked

  coverage:
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    name: coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: cargo-llvm-cov
      - run: |
          cargo llvm-cov --workspace --summary-only | tee -a "$GITHUB_STEP_SUMMARY"

  book:
    needs: [changes]
    if: needs.changes.outputs.docs == 'true' || github.event_name != 'pull_request'
    name: the book builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: install mdbook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL -o mdbook.tar.gz \
            https://github.com/rust-lang/mdBook/releases/download/v0.4.52/mdbook-v0.4.52-x86_64-unknown-linux-gnu.tar.gz
          echo "c0b903f01dd8f4edc644372ad2b80b1fdddd12552d37b6a098657cbd8eddd768  mdbook.tar.gz" | sha256sum -c -
          tar -xzf mdbook.tar.gz -C "$HOME/.local/bin"
      - run: |
          "$HOME/.local/bin/mdbook" build book

  docs-links:
    needs: [changes]
    if: needs.changes.outputs.docs == 'true' || github.event_name != 'pull_request'
    name: documentation links resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --no-progress
            --include-fragments
            --max-retries 3
            --retry-wait-time 5
            --exclude '^https://github\.com/dynamic-config-rs/'
            --exclude '^https://dynamic-config-rs\.github\.io'
            --exclude '^https://docs\.rs/dynamic-config-a'
            --exclude '^https://crates\.io/crates/dynamic-config-a'
            README.md CONTRIBUTING.md SECURITY.md AGENTS.md CHANGELOG.md
            dynamic-config-*/README.md book/src/*.md
          fail: true

  # Always runs: linting the workflows is what catches a mistake in the
  # filtering above, so it must not be filtered by it.
  actionlint:
    name: workflows lint clean
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2

  # The one status branch protection requires. Requiring every job by name
  # breaks the moment a matrix row is renamed; requiring this gate never
  # does. `if: always()` because a gate that is skipped when a dependency
  # fails would count as "not failed" and wave the merge through.
  #
  # A *skipped* job passes, which is what makes the `changes` filtering
  # above safe: the case below matches `failure` and `cancelled` only.
  ci-ok:
    name: CI is green
    needs:
      - changes
      - fmt
      - clippy
      - test
      - examples
      - msrv
      - docs
      - minimal-versions
      - docs-links
      - actionlint
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every job this gate needs has succeeded
        run: |
          results='${{ toJSON(needs.*.result) }}'
          echo "$results"
          case "$results" in
            *failure*|*cancelled*) exit 1 ;;
          esac
