[package]
name = "dynamic-config-axum"
version.workspace = true
edition.workspace = true
# Measured, not copied: `cargo +1.76 check` fails with "axum-core requires
# rustc 1.78 or newer", and 1.80 is the first toolchain above that which
# builds the whole graph. It is also the number `dynamic-config-server`
# arrived at for axum 0.8.
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories.workspace = true
keywords = ["config", "hot-reload", "axum", "tower", "middleware"]
description = "A request-scoped dynamic-config snapshot for axum: one layer, one extractor"
documentation = "https://docs.rs/dynamic-config-axum"
readme = "README.md"
exclude.workspace = true

[dependencies]
dynamic-config-web-core = { workspace = true }
# The layer itself: nothing in it is axum's, so it lives one crate down
# and is re-exported here unchanged. tonic and plain hyper users take it
# directly as `dynamic-config-tower`.
dynamic-config-tower = { workspace = true }
# 0.8.1 rather than 0.8: this crate's own seam — `FromRequestParts` and a
# `tower` layer — is there in 0.8.0, but `loco-rs 1.1` requires `^0.8.1` and
# the workspace resolves once. A floor of 0.8 that the workspace can never
# actually resolve to is a number the `minimal-versions` job would rightly
# refuse, and 0.8.0 has been superseded since.
axum = { version = "0.8.1", default-features = false }

[dev-dependencies]
dynamic-config = { workspace = true, features = ["json", "watch"] }
axum = { version = "0.8.1", features = ["json", "tokio", "http1"] }
# 1.45 because `dynamic-config-loco` depends on this crate by path and
# Loco's `opendal` requires `^1.52`; one workspace resolves once. A dev-only
# floor, so nothing a user of this crate installs is affected.
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "time"] }
# Only the tests and the examples name `tower` — they drive a service
# directly through `ServiceExt`. The library re-exports the layer from
# `dynamic-config-tower` and never names it, so it does not belong in the
# graph of anything that depends on this crate. `0.5.2` because `axum 0.8`
# requires it, so 0.5 was never resolvable.
tower = { version = "0.5.2", features = ["util"] }
serde = { version = "1.0.228", features = ["derive"] }
http-body-util = "0.1"
tempfile = "3"
serde_json = "1.0.149"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
