# cargo-release configuration.
#
#   cargo install cargo-release
#   cargo release patch --execute        # 0.0.1 -> 0.0.2
#   cargo release minor --execute        # 0.0.1 -> 0.1.0
#
# Pre-1.0, a breaking change bumps the *minor* and everything else the patch —
# which is what `minor` and `patch` above mean here.
#
# Publishing itself happens in CI: `release.yml` runs on every push to
# `main`, notices the workspace version is new, and publishes. Nothing here
# talks to crates.io, so a release from a laptop cannot bypass the checks —
# and nothing here tags, either (see below).

# One version across the workspace. These three crates are one product —
# the request scope, and one translation of it per framework — and
# `dynamic-config-web-core` is named exactly by both adapters, so they
# cannot usefully move apart. The *engine* is named with a caret and lives
# elsewhere; that is the boundary this repository releases across.
shared-version = true
consolidate-commits = true

# Prepare only: bump, rewrite changelogs, commit. CI publishes.
#
# `main` accepts no direct pushes — not even from admins — so the release
# commit travels like every other change: on a branch, through a pull
# request, past the gates. The tag is minted by CI at the merge commit,
# after publishing succeeded, because a tag created here would point at a
# commit that is not the one `main` ends up with — the squash-merge makes
# a new one — and a tag that exists before the publish is a tag for a
# release that may never have happened.
publish = false
push = false
tag = false

tag-name = "v{{version}}"
tag-message = "{{crate_name}} {{version}}"
pre-release-commit-message = "release {{version}}"

# Everything has to be green first. This runs before a version number moves,
# once per package — the rotation and the README sync both no-op after the
# first, so the repetition is harmless.
#
# The hook runs from each crate's own directory, so both scripts are reached
# through the repository root rather than a relative path.
pre-release-hook = ["bash", "-c", "just check && root=\"$(git rev-parse --show-toplevel)\" && \"$root\"/scripts/rotate-changelog.sh && \"$root\"/scripts/sync-readme-versions.sh"]
