[package]
name = "dynamic-config-loco"
version.workspace = true
edition.workspace = true
# loco-rs 1.1's own floor, which is the highest in this workspace by a
# wide margin. Measured the same way as the others: what a fresh
# `cargo add dynamic-config-loco` resolves and compiles against.
rust-version = "1.94"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories.workspace = true
keywords = ["config", "hot-reload", "loco", "loco-rs", "initializer"]
description = "A request-scoped dynamic-config snapshot for Loco: one initializer, one extractor"
documentation = "https://docs.rs/dynamic-config-loco"
readme = "README.md"
exclude.workspace = true

[dependencies]
dynamic-config-web-core = { workspace = true }
# The layer and the extractor are axum's; Loco is axum underneath, so this
# crate adds the `Initializer` and nothing else.
dynamic-config-axum = { workspace = true }
# `default-features = false` drops `with-db`, `auth`, `cli`, `worker` and
# the in-memory cache — none of which an initializer touches. A Loco
# application turns them back on for itself, and cargo unifies.
loco-rs = { version = "1.1", default-features = false }
# The same axum Loco uses. Named directly because `Initializer`'s signature
# is `axum::Router`, and Loco's `AxumRouter` alias for it is private.
axum = { version = "0.8.1", default-features = false }
# `loco-rs 1.1` requires `^0.1.74`, and this crate uses the same macro to
# write `impl Initializer`, so the floor is that one.
async-trait = "0.1.74"

[dev-dependencies]
# `testing` for `tests_cfg::app::get_app_context`, the only way to hold an
# `AppContext` outside a booted application — the struct is
# `#[non_exhaustive]`, so nothing downstream can build one. It is what lets
# the test and the example call `after_routes` itself rather than
# re-implementing the one line it runs. `with-db` stays off, so this builds
# no database connection.
loco-rs = { version = "1.1", default-features = false, features = ["testing"] }
dynamic-config = { workspace = true, features = ["json", "watch"] }
axum = { version = "0.8.1", features = ["json", "tokio", "http1"] }
# Loco's `opendal` requires `^1.52`. The axum crate carries the same floor:
# this crate depends on it by path, and one workspace resolves once.
tokio = { version = "1.52", features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5.2", features = ["util"] }
serde = { version = "1.0.228", features = ["derive"] }
http-body-util = "0.1"
tempfile = "3"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
